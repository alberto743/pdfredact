[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfredactcli"
version = "0.1.0"
description = "Redact text in a PDF (true redaction, not just visual overlay) using PyMuPDF"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
authors = [
    { name = "Alberto P." },
]
dependencies = [
    "pymupdf>=1.24",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/alberto743/pdfredact"
Repository = "https://github.com/alberto743/pdfredact"

[project.scripts]
pdfredact = "pdfredact.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdfredact"]

[tool.cibuildwheel]
# Pure-Python package: cibuildwheel builds a single py3-none-any wheel and reuses
# it for every requested identifier, but still runs test-command for each one —
# here that validates install+test on Linux/Windows for every supported Python
# version, not to produce per-ABI wheels.
build = "cp310-* cp311-* cp312-* cp313-*"
test-requires = "pytest"
test-sources = ["tests"]
test-command = "pytest tests"
