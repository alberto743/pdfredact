[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfredact"
version = "0.1.0"
description = "Oscura (redazione vera, non solo visiva) di testo in un PDF con PyMuPDF"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
authors = [
    { name = "Alberto P." },
]
dependencies = [
    "pymupdf>=1.24",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing",
]

[project.scripts]
pdfredact = "pdfredact.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
# Pacchetto puro Python: cibuildwheel costruisce un'unica wheel py3-none-any e la
# riutilizza per ogni identifier richiesto, ma esegue comunque test-command per
# ciascuno — qui serve a validare install+test su Linux/Windows per ogni versione
# di Python supportata, non a produrre wheel per-ABI.
build = "cp310-* cp311-* cp312-* cp313-*"
test-requires = "pytest"
test-sources = ["tests"]
test-command = "pytest tests"
